<title>ЛЕСНИК: По ту сторону окон</title>
<style>
:root{--bg:#080b0b;--panel:#101715;--ink:#e3e8df;--muted:#9ca79d;--red:#b32e38;--green:#9ab89a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif}body{overflow-x:hidden}
button{font:inherit;color:var(--ink);background:#151d19;border:1px solid #59675b;padding:13px 15px;min-height:46px;cursor:pointer;transition:.2s}button:hover{background:#253128;border-color:#a3b59f}button:active{transform:scale(.98)}button:disabled{opacity:.4;cursor:not-allowed}
#app{min-height:100svh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#1b2921 0,#0b100e 48%,#030505 100%)}
.noise{pointer-events:none;position:fixed;inset:0;z-index:20;opacity:.07;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");animation:grain .22s steps(2) infinite}
@keyframes grain{0%{transform:translate(0,0)}50%{transform:translate(1%,-1%)}100%{transform:translate(-1%,1%)}}
.screen{position:relative;z-index:1;min-height:100svh;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hidden{display:none!important}.eyebrow{font:11px/1.5 monospace;letter-spacing:.32em;color:#9aa99b;text-transform:uppercase}.title{font-size:clamp(42px,11vw,94px);line-height:.9;letter-spacing:.07em;text-align:center;text-shadow:0 0 28px #7d9c7540;margin:16px 0}.subtitle{letter-spacing:.24em;color:#9ba69b;text-align:center;font:12px monospace}
.menu-art{width:min(780px,100%);height:clamp(160px,34vh,300px);position:relative;margin:18px auto 22px;overflow:hidden;border:1px solid #2d4032;background:linear-gradient(#111c1a 0%,#1a2821 48%,#070a09 100%)}
.moon{position:absolute;right:15%;top:13%;width:46px;height:46px;border-radius:50%;background:#c3c6a6;box-shadow:0 0 45px #c5d0a744}
.tree{position:absolute;bottom:0;width:0;height:0;border-left:var(--w) solid transparent;border-right:var(--w) solid transparent;border-bottom:var(--h) solid #080e0c;filter:drop-shadow(8px 0 #111b15)}
.cabin{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:33%;height:40%;background:#161b16;border:2px solid #3d4a3d;clip-path:polygon(50% 0,100% 28%,100% 100%,0 100%,0 28%)}.cabin:before{content:"";position:absolute;left:43%;bottom:0;width:18%;height:44%;background:#050706;border:1px solid #4a5948}.win{position:absolute;top:38%;left:17%;width:18%;height:22%;background:#a9b98b;box-shadow:0 0 18px #b5ca8c;animation:windowFlicker 6s infinite}.win2{left:65%;background:#7d8e70;animation-delay:2.3s}
@keyframes windowFlicker{0%,88%,92%,100%{opacity:.8}90%{opacity:.06}}
.menu-buttons{display:grid;gap:10px;width:min(430px,100%)}.chapter{display:flex;justify-content:space-between;align-items:center;text-align:left}.chapter small{display:block;color:var(--muted);font:11px monospace;margin-top:5px}.chapter .status{font:10px monospace;letter-spacing:.12em;color:#a4c39e}.chapter.locked{color:#6f7770;border-color:#303832}.foot{font:10px monospace;color:#657067;text-align:center;margin-top:20px;letter-spacing:.12em}
#game{justify-content:flex-start;padding:0}.hud{width:100%;display:flex;justify-content:space-between;gap:8px;padding:12px 14px;background:#070a09d9;border-bottom:1px solid #263329;font:10px monospace;letter-spacing:.08em;color:#a7b4a7;position:sticky;top:0;z-index:5}.hud span:last-child{text-align:right}
.scene{width:min(900px,100%);margin:auto;flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px 4px 28px}.scene-art{height:clamp(190px,33vh,310px);width:100%;position:relative;overflow:hidden;background:#111a15;border:1px solid #29372b;margin-bottom:20px}
.scene h2{font-size:clamp(25px,6vw,40px);font-weight:normal;margin:0 0 12px}.story{font-size:17px;line-height:1.65;color:#cbd3c9;max-width:700px;white-space:pre-line}.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin-top:20px}.log{border-left:2px solid #70856b;padding:8px 12px;color:#b7c7b1;background:#101813;margin:10px 0;font:12px/1.5 monospace}
.forest{background:linear-gradient(#101c1b,#1b2920 58%,#060907)}.fog{position:absolute;inset:35% -20% 0;background:linear-gradient(0deg,#c1c9b611,#9eada322,transparent);filter:blur(12px);animation:fogmove 9s ease-in-out infinite alternate}.silhouette{position:absolute;bottom:0;width:0;height:0;border-left:var(--w) solid transparent;border-right:var(--w) solid transparent;border-bottom:var(--h) solid #050a08}.person{position:absolute;bottom:13%;left:48%;width:8px;height:52px;background:#030504;box-shadow:0 0 14px #000}.person:before{content:"";position:absolute;top:-14px;left:-4px;width:16px;height:16px;border-radius:50%;background:#030504}
@keyframes fogmove{to{transform:translateX(30px);opacity:.45}}
.room{background:linear-gradient(#0d1310 0 60%,#171710 61%,#070907)}.floor{position:absolute;left:-10%;right:-10%;bottom:-20%;height:45%;background:repeating-linear-gradient(0deg,#171d16 0 3px,#0a0e0b 4px 6px);transform:perspective(100px) rotateX(5deg)}.fireplace{position:absolute;left:38%;bottom:17%;width:25%;height:50%;border:7px solid #3a3024;background:#020303;box-shadow:inset 0 -15px 25px #9b381b}.flame{position:absolute;bottom:0;left:30%;width:40%;height:48%;background:linear-gradient(#f8b34a,#c93d16 60%,transparent);clip-path:polygon(50% 0,65% 42%,100% 62%,75% 100%,22% 100%,0 60%,35% 38%);filter:drop-shadow(0 0 12px #e66b1d);animation:fire .7s infinite alternate}.wood{position:absolute;bottom:12%;left:10%;width:22%;height:8px;background:#5b3d24;transform:rotate(-9deg);box-shadow:0 8px #302217}.windowframe{position:absolute;top:13%;left:7%;width:27%;height:40%;border:8px solid #3b4438;background:#050a0a;box-shadow:inset 0 0 25px #111}.windowframe:after{content:"";position:absolute;left:48%;top:0;bottom:0;width:5px;background:#343c33}.windowframe:before{content:"";position:absolute;left:0;right:0;top:48%;height:5px;background:#343c33}
.parallel{filter:hue-rotate(40deg) contrast(1.18);background:linear-gradient(#180f24,#251a30 55%,#08070d)}.parallel .windowframe{box-shadow:0 0 20px #b0203a,inset 0 0 20px #a71d4c}.shadowperson{position:absolute;right:13%;bottom:15%;width:20px;height:130px;background:#010102;filter:blur(1px);animation:watch 5s infinite}.shadowperson:before{content:"";position:absolute;top:-25px;left:-8px;width:36px;height:36px;background:#010102;border-radius:50%}.shadowperson:after{content:"";position:absolute;top:0;left:5px;width:6px;height:4px;background:#c5d0bc;box-shadow:12px 0 #c5d0bc}
@keyframes watch{0%,70%,100%{opacity:0}72%,84%{opacity:1}90%{opacity:.2}}
.lab{background:linear-gradient(#141719,#222323 55%,#060708)}.labdoor{position:absolute;left:33%;bottom:0;width:34%;height:88%;border:4px solid #535b5c;background:repeating-linear-gradient(90deg,#171b1c 0 24px,#222728 25px 27px)}.labdoor:after{content:"ОБЪЕКТ 09";position:absolute;top:16%;width:100%;text-align:center;font:clamp(10px,2vw,15px) monospace;letter-spacing:.2em;color:#bd333b;text-shadow:0 0 12px #f33}.redlight{position:absolute;top:5%;left:10%;width:80%;height:4px;background:#9e2028;box-shadow:0 0 20px #c22;animation:alarm 2s infinite}
@keyframes alarm{50%{opacity:.1}}
#overlay{position:fixed;inset:0;background:#000;z-index:30;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;opacity:0;pointer-events:none;transition:opacity .15s}#overlay.show{opacity:1}.overlaytext{font:clamp(24px,7vw,54px) monospace;color:#e6e6df;text-shadow:0 0 16px #a00;letter-spacing:.06em}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:40;background:#111914;border:1px solid #556653;padding:12px 16px;width:max-content;max-width:90%;font:12px/1.5 monospace;display:none}
body.dread{animation:dread 1s steps(2) infinite} @keyframes dread{0%{filter:none}48%{filter:contrast(1.25)}50%{filter:brightness(.75)}100%{filter:none}}
@media(min-width:700px){.screen{padding:30px}.scene{padding:22px}.actions{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:3s!important}}
</style>
</head>
<body>
<div id="app">
<div class="noise"></div>
<section id="menu" class="screen">
  <div class="eyebrow">ЗАПИСЬ ВОССТАНОВЛЕНА • 03:17</div>
  <h1 class="title">ЛЕСНИК</h1><div class="subtitle">ПО ТУ СТОРОНУ ОКОН</div>
  <div class="menu-art" aria-label="Силуэт лесного дома">
    <div class="moon"></div>
    <div class="tree" style="--w:90px;--h:88%;left:8%"></div><div class="tree" style="--w:130px;--h:100%;left:20%"></div><div class="tree" style="--w:95px;--h:90%;right:7%"></div><div class="tree" style="--w:125px;--h:105%;right:20%"></div>
    <div class="cabin"><div class="win"></div><div class="win win2"></div></div>
  </div>
  <div class="menu-buttons">
    <button id="continueBtn" onclick="continueGame()">▶ ПРОДОЛЖИТЬ</button>
    <button onclick="newGame()">НАЧАТЬ НОВУЮ ИГРУ</button>
    <button class="chapter" onclick="startChapter(1)"><span>ГЛАВА 1 — ДОМ ЛЕСНИКА<small>ЛЕС • КАМИН • ОКНА</small></span><span class="status">ДОСТУПНА</span></button>
    <button class="chapter" onclick="startChapter(2)"><span>ГЛАВА 2 — THE LAB<small>ЛАБОРАТОРИЯ • B-130 • СЕКРЕТЫ</small></span><span class="status">ДОСТУПНА</span></button>
    <button class="chapter locked" onclick="lockedChapter(3)"><span>ГЛАВА 3 — ПОСЛЕДНИЙ ЛЕС<small>НЕИЗВЕСТНО</small></span><span>🔒</span></button>
    <button onclick="settings()">⚙ НАСТРОЙКИ ЗВУКА</button>

</section>

 <div class="hud"><span id="chapterLabel">ГЛАВА 1 / ДОМ ЛЕСНИКА</span><span id="objective">НАЙТИ ДОМ</span><span id="clock">00:00</span></div>
 <div class="scene">
  <div id="sceneArt" class="scene-art forest"></div>

<script>
(()=> {
const $=id=>document.getElementById(id);
const state={scene:'forest',woods:0,notes:0,windowsClosed:0,windowsOpen:false,parallelStarted:0,lastWindow:0,startedAt:0,scareCount:0,settings:{sound:true},history:[],labItems:[],labQuestDone:false,labEndingDone:false,labSecretNote:false,labPower:false,labReset:false};
let audioCtx=null, musicNodes=[], musicTimer=null, musicStarted=false, tickTimer=null, elapsed=0, sceneToken=0;
const copy={
 forest:{title:'ЛЕС НЕ ЗАКАНЧИВАЕТСЯ',text:'Ты уже давно идёшь между соснами. Тропа позади исчезает в тумане, хотя ты точно шёл по ней. В кармане вибрирует телефон. На экране одно новое сообщение от неизвестного номера:\n\n«НЕ СТУЧИ. ЕСЛИ ОН ОТКРОЕТ — НЕ СМОТРИ ЕМУ В ЛИЦО»',objective:'НАЙТИ ДОМ'},
 porch:{title:'ДОМ ЛЕСНИКА',text:'Дом стоит там, где на карте должна быть река. На двери висит табличка «ЛЕСНИК И. КАРПОВ». Под дверью — свежая грязь. Изнутри кто-то трижды стучит в ответ на твои шаги.',objective:'ВОЙТИ В ДОМ'},
 inside:{title:'ЧУЖИЕ СЛЕДЫ',text:'Пахнет мокрой древесиной и золой. На стене висят фотографии леса. На каждой фотографии ты стоишь у этого дома — в одежде, которую носишь сейчас. На последней снимок сделан изнутри комнаты. Ты спишь на диване.',objective:'НАЙТИ ДРОВА'},
 wood:{title:'ДРОВА',text:'У крыльца лежат поленья. На одном выцарапано: «НЕ ЗАЖИГАЙ ОГОНЬ ПОСЛЕ ПОЛУНОЧИ». Часы в доме показывают 03:17, но ты уверен, что ещё вечер.',objective:'СОБРАТЬ ДРОВА'},
 fire:{title:'КАМИН',text:'Ты кладёшь дрова в камин. Огонь вспыхивает слишком ярко и на секунду становится белым. В пламени виден коридор — такой же, как в доме, только весь залит водой. Из дымохода доносится тихий смешок.',objective:'ЛЕЧЬ СПАТЬ'},
 sleep:{title:'НЕ ОТКРЫВАЙ ГЛАЗА',text:'Ты ложишься на диван. Огонь потрескивает, хотя ты точно видел, как он погас. Из темноты звучит детский голос: «А можно мы тоже поспим у тебя?»\n\nТы закрываешь глаза. Кто-то садится рядом. Матрас прогибается. Раз. Два. Три.\n\nКогда ты снова открываешь глаза, тишина стала слишком громкой.',objective:'ОСМОТРЕТЬ ДОМ'},
 parallel:{title:'ДОМ ПО ТУ СТОРОНУ',text:'Дом тот же. Но за окнами — чёрное небо и неподвижные деревья, висящие корнями вверх. На стене появилась надпись, будто её процарапали изнутри:\n\n«ЕСЛИ ОКНО ОТКРЫТО — ОНО УЖЕ ЗНАЕТ ТВОЁ ИМЯ»\n\nВ дальнем углу кто-то медленно поворачивает голову к тебе.',objective:'ЗАКРЫВАТЬ ОКНА'},
 escape:{title:'ДОМ НЕ ХОЧЕТ ТЕБЯ ОТПУСКАТЬ',text:'Стены дрожат. Окна хлопают сами, а под полом кто-то бежит следом за тобой. В стене расползается узкая щель, за которой вместо кирпичей — висящие в пустоте доски. Это единственный путь.',objective:'ПРОЙТИ ПАРКУР'},
 lab:{title:'ОБЪЕКТ 09',text:'За последним прыжком стоит бетонная дверь. На ней твоя фотография, но ты на ней старше. Внутри гудят лампы. Мониторы показывают дом с разных ракурсов — один экран показывает комнату, в которой ты сейчас стоишь. На другом кто-то смотрит прямо в камеру.\n\nПринтер оживает и печатает единственную строку:\n\n«ИСПЫТАНИЕ №1 ЗАВЕРШЕНО. СУБЪЕКТ ПОМНИТ ДОМ»',objective:'ГЛАВА 1 ЗАВЕРШЕНА'},
 lab2_start:{title:'СЛОМАННЫЙ ЛИФТ',text:'Ты добираешься до лаборатории. Лифт сломан, а внутри стоит лестница. Другого пути наверх нет.',objective:'ПОДНЯТЬСЯ ПО ЛЕСТНИЦЕ'},
 lab2_hall:{title:'КОРИДОР ДВЕРЕЙ',text:'Наверху тянется коридор с множеством дверей. Большинство не открывается. Доступны только две комнаты.',objective:'НАЙТИ КВЕСТЕРА'},
 lab2_quest1:{title:'КВЕСТЕР № 1',text:'Квестер просит найти ведро с водой, спуститься на первый этаж и потушить синий огонь. В параллельном мире весь огонь синий. За огнём лежит папка с документами.',objective:'НАЙТИ ВЕДРО И ПАПКУ'},
 lab2_fire:{title:'СИНИЙ ОГОНЬ',text:'На первом этаже бушует синий огонь. За ним видна папка с документами. Нужно найти ведро с водой, потушить огонь и забрать папку.',objective:'ПОТУШИТЬ ОГОНЬ'},
 lab2_capsules:{title:'КОМНАТА КАПСУЛ',text:'Стена в коридоре сдвигается, открывая огромную комнату с зелёными капсулами. Внутри — существа, похожие на червей. В центре стоит огромная капсула с проводами и кнопками. На кнопке появляется сообщение: «НЕТ ЭНЕРГИИ». В комнате три железные двери: средняя заперта, правая ведёт в опасный коридор, левая — к SECURITY.',objective:'ИССЛЕДОВАТЬ КОМНАТУ'},
 lab2_right:{title:'КОРИДОР-ЛОВУШКА',text:'Ты идёшь по коридору к двери в конце. Внезапно пол проваливается под ногами…',objective:'ENDING 1'},
 lab2_security:{title:'SECURITY',text:'За дверью SECURITY — комната с выключенными и сломанными экранами. Квестер указывает на вентиляцию и просит уничтожить монстра.',objective:'НАЙТИ B-130'},
 lab2_vent:{title:'ВЕНТИЛЯЦИЯ',text:'Внутри вентиляции ты находишь предупреждение: «не используйте фонарики они прожигают кожу монстрам использовать только в случае побега монстра любой яркий свет может убить всех так что молитесь чтоб б-130 не сбежал». В конце прохода слышен гул.',objective:'ДОБРАТЬСЯ ДО АРЕНЫ'},
 lab2_boss:{title:'B-130',text:'Дверь за вентиляцией открывается. B-130 управляет огнём и светом, сам не восприимчив к свету, но свет ненадолго ослепляет его. Он физически слабее других монстров.',objective:'ПОБЕДИТЬ B-130'},
 lab2_afterboss:{title:'ПОСЛЕ B-130',text:'B-130 проваливается под землю. На полу лежит отвёртка. Рядом — вентиляционный проход обратно к SECURITY.',objective:'ВЕРНУТЬСЯ В SECURITY'},
 lab2_security2:{title:'КВЕСТЕР № 2',text:'Ты возвращаешься к квестеру в SECURITY и сдаёшь задание. Он ничего не даёт взамен. В соседней комнате лежит красная записка, но текст на ней размыт.',objective:'ОСМОТРЕТЬ КОМНАТУ ЗА SECURITY'},
 lab2_note1:{title:'РАЗМЫТАЯ ЗАПИСКА',text:'Ты вкладываешь красную записку в дневник. Прочитать её невозможно. За дверью начинается длинный коридор с множеством одинаковых комнат.',objective:'НАЙТИ УЧЁНОГО'},
 lab2_cells:{title:'КОМНАТЫ СОДЕРЖАНИЯ',text:'В коридоре много одинаковых комнат. На стенах видны следы от ногтей. Похоже, здесь держали людей.',objective:'НАЙТИ КВЕСТЕРА № 3'},
 lab2_scientist:{title:'УЧЁНЫЙ',text:'Ты спрашиваешь, что здесь происходило. Учёный отвечает, что не может ничего рассказывать, и поручает собрать три предмета: отвёртку, молоток и красную ключ-карту. Предметы появляются в случайных комнатах.',objective:'СОБРАТЬ 3 ПРЕДМЕТА'},
 lab2_search:{title:'СЛУЧАЙНАЯ КОМНАТА',text:'Комната выглядит почти так же, как остальные. Осмотри её: предметы каждый раз могут лежать в разных комнатах.',objective:'ИСКАТЬ ПРЕДМЕТЫ'},

function scare(kind){if(!state.settings.sound)return;const o=$('overlay'),t=$('overlayText');const messages={sleep:'ТЫ НЕ ОДИН.',parallel:'НЕ СМОТРИ В ОКНО.',window:'ОН УЖЕ В КОМНАТЕ.',small:'ТЫ СЛЫШАЛ ЭТО?',escape:'НЕ ПАДАЙ.'};t.textContent=messages[kind]||'ОБЕРНИСЬ';o.classList.add('show');document.body.classList.add('dread');setTimeout(()=>{o.classList.remove('show');document.body.classList.remove('dread')},kind==='window'?850:500)}
function initAudio(){if(!state.settings.sound)return false;try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return true}catch(e){return false}}
function playNote(freq,duration=.25){if(!initAudio())return;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.045,audioCtx.currentTime+.03);gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+duration+.02)}
function startAmbient(){if(!initAudio())return;/* intentionally mostly silent */playNote(55,1.2)}
function playJokeMusic(){if(!initAudio())return;stopMusicOnly();musicStarted=true;const start=audioCtx.currentTime;const master=audioCtx.createGain(),filter=audioCtx.createBiquadFilter(),dist=audioCtx.createWaveShaper();master.gain.setValueAtTime(.0001,start);master.gain.exponentialRampToValueAtTime(.14,start+.6);filter.type='lowpass';filter.frequency.setValueAtTime(5000,start);dist.curve=makeDistortion(0);dist.oversample='4x';filter.connect(dist);dist.connect(master);master.connect(audioCtx.destination);musicNodes=[master,filter,dist];const melody=[659.25,783.99,880,783.99,659.25,523.25,587.33,659.25,523.25,440,523.25,659.25,783.99,659.25,523.25,392];let idx=0;const play=()=>{if(!musicStarted||!audioCtx)return;const now=audioCtx.currentTime;let t=now;for(let j=0;j<4;j++){let f=melody[idx%melody.length];const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.setValueAtTime(f,t);o.frequency.linearRampToValueAtTime(f*(1+(idx/90)),t+.22);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.15,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.24);o.connect(g);g.connect(filter);o.start(t);o.stop(t+.26);t+=.27;idx++}const progress=Math.min(1,(audioCtx.currentTime-start)/21);filter.frequency.setTargetAtTime(Math.max(160,5000*(1-progress)),now,.3);dist.curve=makeDistortion(progress);if(progress>.25&&Math.random()<.3){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sawtooth';o.frequency.value=75+Math.random()*800;g.gain.value=.025*progress;o.connect(g);g.connect(filter);o.start(now);o.stop(now+.12+Math.random()*.25)}if(progress>=1){master.gain.setTargetAtTime(.0001,now,.4);setTimeout(stopMusicOnly,1800);return}musicTimer=setTimeout(play,1050)};play()}
function makeDistortion(amount){const n=256,curve=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;curve[i]=((1+amount*25)*x)/(1+amount*25*Math.abs(x))}return curve}
function startDreadMusic(){if(!initAudio())return;stopMusicOnly();musicStarted=true;const start=audioCtx.currentTime,master=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();master.gain.setValueAtTime(.0001,start);master.gain.linearRampToValueAtTime(.045,start+2);filter.type='lowpass';filter.frequency.value=600;filter.connect(master);master.connect(audioCtx.destination);musicNodes=[master,filter];let step=0;const notes=[110,146.8,130.8,98,164.8,123.5];const pulse=()=>{if(!musicStarted)return;const now=audioCtx.currentTime,progress=Math.min(1,(now-start)/24);const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(notes[step%notes.length],now);o.frequency.linearRampToValueAtTime(notes[step%notes.length]*(1+progress*1.8),now+.8);g.gain.setValueAtTime(.0001,now);g.gain.linearRampToValueAtTime(.4,now+.2);g.gain.exponentialRampToValueAtTime(.0001,now+1.3);o.connect(g);g.connect(filter);o.start(now);o.stop(now+1.35);filter.frequency.setTargetAtTime(Math.max(70,600*(1-progress)),now,.5);master.gain.setTargetAtTime(progress>.75?.0001:.045,now,1);step++;if(progress>=1){stopMusicOnly();return}musicTimer=setTimeout(pulse,900)};pulse()}
function stopMusicOnly(){musicStarted=false;clearTimeout(musicTimer);musicTimer=null;for(const n of musicNodes){try{if(n.gain)n.gain.setTargetAtTime(.0001,audioCtx.currentTime,.1);else if(n.disconnect)n.disconnect()}catch(e){}}musicNodes=[]}
function stopAllAudio(){stopMusicOnly();if(audioCtx){try{audioCtx.suspend()}catch(e){}}}
